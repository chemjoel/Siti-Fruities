kind = "web"
previewPath = "/"
title = "Siti Fruities"
version = "1.0.0"
id = "artifacts/siti-fruities"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19977

[services.development]
run = "pnpm --filter @workspace/siti-fruities run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/siti-fruities", "run", "build" ]
serve = "static"
publicDir = "artifacts/siti-fruities/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19977"
BASE_PATH = "/"
